# SRS (Simple Realtime Server) configuration for Sequi
# Docs: https://ossrs.net/lts/zh-cn/docs/v5/doc/config

listen              1935;
max_connections     1000;
daemon              off;
srs_log_tank        console;

http_server {
    enabled         on;
    listen          8080;
    dir             ./objs/nginx/html;
}

# SRS HTTP API — используется backend для получения viewer count
http_api {
    enabled         on;
    listen          1985;
}

stats {
    network         0;
}

vhost __defaultVhost__ {
    # HTTP hooks — SRS вызывает backend при старте/остановке стрима
    http_hooks {
        enabled         on;

        # Вызывается когда OBS начинает публикацию
        # backend проверяет stream key и обновляет статус на live
        # secret must match SRS_HOOK_SECRET in .env
        on_publish      http://host.docker.internal:8888/api/hooks/stream/start?secret=change-me-hook-secret;

        # Вызывается когда OBS прекращает публикацию
        # backend обновляет статус на offline
        on_unpublish    http://host.docker.internal:8888/api/hooks/stream/stop?secret=change-me-hook-secret;
    }

    # HLS output — браузер воспроизводит HLS через hls.js
    hls {
        enabled         on;
        hls_fragment    2;      # длина одного сегмента в секундах (2s для низкой задержки)
        hls_window      6;      # сколько секунд хранить в плейлисте (3 сегмента)
        hls_path        ./objs/nginx/html;
        hls_m3u8_file   [app]/[stream]/index.m3u8;
        hls_ts_file     [app]/[stream]/[seq].ts;
    }
}
